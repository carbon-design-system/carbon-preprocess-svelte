on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Find unused files, exports, and dependencies
        run: bun run knip

      - name: Run unit tests
        run: bun run test

      - name: Use the package as a consumer would
        run: bun run test:package

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          E2E_OBSERVED: e2e-observed.json

      # Sizes changed on purpose? `bun run snapshots:from-ci` applies these.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-snapshots
          path: e2e-observed.json
          if-no-files-found: ignore
