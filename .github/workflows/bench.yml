name: Benchmark

# On a pull request, pairs every benchmark task on the PR (candidate)
# against its base with `ostia ab`: both sides run interleaved in one
# process, in both orders, so a runner that slows down mid-job can't
# favor either, and flagged tasks are re-measured in fresh processes.
# Informational: the comparison goes to the job summary and never fails
# the job. On main, the run is kept as an artifact, a baseline.
on:
  pull_request:
    paths:
      - "src/**"
      - "bench/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bench.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bench/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bench.yml"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Benchmark main
        if: github.event_name == 'push'
        run: bun run bench --export-json "$GITHUB_WORKSPACE/head.json"

      # Each side runs its own benchmark files: a task only one side has is
      # listed under "Not compared" (give a renamed task `aliases` to keep
      # it compared).
      - name: Compare with the base
        if: github.event_name == 'pull_request'
        run: |
          set +e
          ./node_modules/.bin/ostia ab bench/*.bench.ts \
            --base "origin/${{ github.base_ref }}" \
            --export-json "$GITHUB_WORKSPACE/compare.json" \
            --format markdown > compare.md
          status=$?
          {
            echo "### Benchmarks: this pull request vs its base"
            echo
            cat compare.md
            if [ "$status" -eq 1 ]; then
              echo
              echo "Some tasks regressed past ostia's thresholds, confirmed in fresh processes."
            elif [ "$status" -gt 1 ]; then
              echo
              echo "ostia ab failed (exit $status); see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-${{ github.event_name == 'push' && 'main' || 'pr' }}
          path: |
            head.json
            compare.json
            compare.md
          if-no-files-found: ignore
