<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>carbon-preprocess-svelte playground</title>
    <!-- The Plex faces every page uses (Carbon's CSS loads them from IBM's CDN
         only once it's parsed): fetched now, they're in before the first
         paint, so text doesn't rewrap when they swap in. -->
    <link rel="preconnect" href="https://1.www.s81c.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-Regular-Latin1.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-Light-Latin1.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-SemiBold-Latin1.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://1.www.s81c.com/common/carbon/plex/fonts/IBM-Plex-Mono/fonts/split/woff2/IBMPlexMono-Regular-Latin1.woff2">
  </head>
  <body>
    <script type="module">
      import { mount } from "svelte";
      import App from "./src/App.svelte";

      mount(App, { target: document.body });
    </script>
  </body>
</html>
