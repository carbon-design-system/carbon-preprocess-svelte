# `bun lint` and `bun fmt` (Bun canary).

[lint]
maxWarnings = 0

# ESLint and typescript-eslint recommended are on by default; these add the
# stricter checks the project enforces on top.
[lint.rules]
"@typescript-eslint/ban-ts-comment" = ["error", { "ts-expect-error" = false }]
"@typescript-eslint/consistent-type-exports" = "error"
"@typescript-eslint/consistent-type-imports" = [
  "error",
  { disallowTypeAnnotations = false },
]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-unnecessary-type-constraint" = "error"
"@typescript-eslint/no-useless-empty-export" = "error"
"dot-notation" = "error"
"import/no-cycle" = "error"
"jest/no-disabled-tests" = "error"
"jest/no-focused-tests" = "error"
"no-await-in-loop" = "error"
"no-extra-label" = "error"
"no-lone-blocks" = "error"
"no-restricted-imports" = [
  "error",
  { paths = [
    { name = "bun:test", message = "bun:test imports are unnecessary." },
  ] },
]
"no-restricted-syntax" = [
  "error",
  { selector = "UnaryExpression[operator='delete'] > MemberExpression[computed=false]", message = "Avoid the delete operator; assign undefined or rebuild the object." },
  { selector = "ExportAllDeclaration", message = "Export names explicitly instead of re-exporting everything." },
  { selector = "ImportDeclaration[importKind!='type'] > ImportNamespaceSpecifier", message = "Import names explicitly instead of a namespace." },
  { selector = ":function Literal[regex]:not([regex.flags=/[gy]/])", message = "Hoist the regular expression to the top level so it compiles once." },
  { selector = "TSEnumDeclaration", message = "Use a union of literals or a const object instead of an enum." },
]
"no-useless-constructor" = "error"
"no-useless-rename" = "error"
"oxc/no-accumulating-spread" = "error"
"prefer-arrow-callback" = "error"
"prefer-const" = "error"
"unicorn/no-array-for-each" = "error"
"unicorn/no-useless-switch-case" = "error"
"unicorn/prefer-node-protocol" = "error"

# Scripts, examples and the build-driven tests run their steps one at a
# time, so each build's output and errors stay readable.
[[lint.overrides]]
files = [
  "scripts/**",
  "examples/**",
  "tests/test-e2e.ts",
  "tests/golden-sizes.test.ts",
]
rules = { "no-await-in-loop" = "off" }

# Rules for the markup of `.svelte` files, which `bun lint` can't read:
# svelte-lint (`bun run lint:svelte`) lints their scripts and markup
# expressions with the rules above, and their markup with these.
[svelte-lint]
# `svelte/compiler`: the compiler's own warnings, such as a scoped selector
# that matches nothing, which Svelte drops from the CSS without a word.
rules = { "svelte/require-each-key" = "off", "svelte/compiler" = "error" }

[fmt]
# Markdown and YAML stay hand-formatted. Fixtures are inputs the tests
# compare byte for byte.
ignorePatterns = ["**/*.md", "**/*.yml", "**/*.yaml", "tests/fixtures/**"]

[fmt.svelte]
sortOrder = "none"
